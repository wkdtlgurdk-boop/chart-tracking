# 시계는 여기 없다. Apps Script 가 workflow_dispatch 로 부른다
# (industry-report-telegram-bot/appsscript/dispatch.gs 의 dispatchChartTracking).
# 형제 봇 넷과 같은 방식이다.
#
# cron 을 걷어낸 실측 근거 — 평일이면 하루 12번 떠야 하는데:
#
#   9/22 (화)  10:34 · 13:48 · 18:54 · 23:55        네 번, 시각도 제멋대로
#   9/23 (수)  00:29 그리고 끝. 08:15 · 09:15 · 10:15 전부 안 뜸
#
# 23:55 과 00:29 는 창(20:15) 한참 밖이다. 장중 스캔이 몇 시간씩 비면 신호가
# 나도 그날 못 본다. 같은 계정에서 tradesignal 도 같은 이유로 9/22 에 옮겼고,
# Apps Script 타이머는 산업리포트를 닷새 내리 5초 안쪽에 띄웠다.
#
# 대신 Apps Script 가 조용히 안 뜨면 그 시간대는 통째로 빈다. 트리거 목록은
# 그쪽 listTriggers 로 확인한다.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "지금 바로 스캔 (시간대·휴장일·중복 체크 무시)"
        type: boolean
        default: false

# 실행이 겹치지 않게 한 줄로 세움 (watchlist.txt / state.json 커밋 충돌 방지)
concurrency:
  group: chart-tracking
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scan & Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 trade_signal.py ${{ inputs.force && '--force' || '' }}

      - name: Save watchlist/state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.txt state.json
          git diff --cached --quiet && exit 0
          git commit -m "update watchlist/state"
          git pull --rebase
          git push

name: chart-tracking

on:
  schedule:
    # (cron 은 UTC. GitHub 이 보통 10~20분 늦게 실행함)
    # 평일 KST 08:15~20:15 매시 15분 — 텔레그램 명령 처리, 10:15~19:15 는 장중 스캔도 함
    #
    # 예전에는 19:15 가 아니라 15:15 까지였다. KRX 거래시간이 20:00 으로 늘면서
    # 15~20시 다섯 시간이 통째로 빈 채였다 -- 그 사이 신호가 나도 다음 날 아침에야
    # 알았다.
    - cron: "15 23 * * 0-4"
    - cron: "15 0-11 * * 1-5"
    # 장 마감 후 종가 알림 (KST 20:10) — 늦거나 빠지면 20:15 실행이 대신 보냄
    #
    # 15:42 였다. 그때는 정규장이 15:30 에 끝났으므로 맞는 자리였는데, 지금은
    # 시간외·NXT 가 20:00 까지 종가를 움직인다. 15:42 에 "종가 기준"이라고
    # 적어 보낸 값은 종가가 아니었다.
    - cron: "10 11 * * 1-5"
    # 주말 6시간마다 명령만 처리 (KST 토·일 09:15/15:15/21:15, 월 03:15)
    # 텔레그램은 안 가져간 메시지를 24시간만 보관하므로 주말 공백을 메움
    - cron: "15 */6 * * 6,0"
  workflow_dispatch:
    inputs:
      force:
        description: "지금 바로 스캔 (시간대·휴장일·중복 체크 무시)"
        type: boolean
        default: false

# 실행이 겹치지 않게 한 줄로 세움 (watchlist.txt / state.json 커밋 충돌 방지)
concurrency:
  group: chart-tracking
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scan & Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 trade_signal.py ${{ inputs.force && '--force' || '' }}

      - name: Save watchlist/state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.txt state.json
          git diff --cached --quiet && exit 0
          git commit -m "update watchlist/state"
          git pull --rebase
          git push

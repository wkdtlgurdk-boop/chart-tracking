name: check-endpoints

# 네이버 엔드포인트가 살아 있는지 러너에서 확인한다.
#
# 이 봇은 PC 작업 스케줄러에서 도는데, 조회가 전부 실패하면 로그가 그 PC 안에만
# 남아 '네이버가 바뀐 것'과 '내 PC 에서만 막힌 것'을 가를 수가 없다. 같은 호출을
# 여기서도 해 보면 갈린다 — 양쪽 다 실패면 엔드포인트가 바뀐 것이고, 여기서만
# 되면 PC 쪽(IP 차단·프록시·백신) 문제다.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "확인할 종목코드 (기본 005930)"
        type: string
        default: "005930"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python check_endpoints.py "${{ inputs.code }}"
